# Database Configuration
spring.datasource.url=jdbc:sqlserver://sqlsrv-appmod-demo.database.windows.net:1433;database=sqldb-medical-java-demo;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30
spring.datasource.username=AzureUser@sqlsrv-appmod-demo
spring.datasource.password=AppModernization@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JSP Configuration
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:src/main/webapp/
spring.mvc.static-path-pattern=/**

# JSP Servlet Configuration
server.servlet.jsp.init-parameters.development=true

# Session Configuration
server.servlet.session.timeout=30m

# Error Handling
server.error.whitelabel.enabled=false

# Logging
logging.level.com.org=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG