spring:
  application:
    name: hospital-management

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Java 21 virtual threads (Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  mvc:
    view:
      prefix: /
      suffix: .jsp
    static-path-pattern: /**

  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - file:src/main/webapp/

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
    jsp:
      init-parameters:
        development: false
  error:
    whitelabel:
      enabled: false

logging:
  level:
    com.org: INFO
    org.springframework: INFO
    org.springframework.web: INFO
