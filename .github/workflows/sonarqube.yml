name: JavaModernization/sonarqube_custom_agent

on:
  workflow_dispatch:
    inputs:
      buildConfiguration:
        default: Release
        type: string
        required: false

env:
  sonarQubeUrl: https://sonarqube-hub.azurewebsites.net

jobs:
  SonarQube-Scan:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Find and Build Java Project
        run: |
          POM_FILE=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
          if [ -z "$POM_FILE" ]; then
            echo "No pom.xml found"
            exit 1
          fi
          echo "Found pom.xml at: $POM_FILE"
          mvn clean verify -DskipTests -f "$POM_FILE"
        shell: bash

      - name: SonarQube Scan
        run: |
          POM_FILE=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
          mvn sonar:sonar -f "$POM_FILE" \
            -Dsonar.projectKey=Refactoring-legacy-Hospital-uc2 \
            -Dsonar.projectName=Refactoring-legacy-Hospital-uc2 \
            -Dsonar.host.url=${{ env.sonarQubeUrl }} \
            -Dsonar.token=${{ secrets.sonarQubeToken }} \
            -Dsonar.exclusions=**/webapp/**,**/assets/** \
            -Dsonar.newCode.referenceBranch=main
        shell: bash